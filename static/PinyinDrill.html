<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>普测拼音刷题 · 易错字词拼音练习</title>
<meta name="theme-color" content="#f4f6f8">
<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --ink:#1f2933; --sub:#64727f; --line:#e2e8ee;
    --brand:#2563a8; --brand-soft:#e8f1fa; --ok:#1e8a5a; --ok-soft:#e6f4ec;
    --bad:#c63b3b; --bad-soft:#fbecec; --warn:#9a6a17;
    --radius:14px; --shadow:0 1px 3px rgba(20,40,60,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5;
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
  }
  html{color-scheme:light;scrollbar-gutter:stable}  /* 预留滚动条宽度，答对/答错切换时不左右跳 */
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
  /* 布局：窄屏上下排（控制条在上），宽屏左右排（选项在左，进度与答题区在右） */
  .layout{display:flex;flex-direction:column;gap:16px}
  .main{display:flex;flex-direction:column;gap:16px;min-width:0}
  @media (min-width:900px){
    .wrap{max-width:1080px;padding-top:24px}
    /* 左栏高度跟随右栏：两列等高，左栏内容在行间均分，避免左侧短一截 */
    .layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:20px;align-items:stretch}
    .layout .controls{align-content:space-between}
    #remoteUrl{width:100%}
    .result-slot{min-height:206px}
    .stem{font-size:44px}
    .stem.pinyin{font-size:34px}
  }
  header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  header.top h1{font-size:20px;font-weight:700}
  header.top .meta{font-size:13px;color:var(--sub)}

  /* 控制条 */
  .controls{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:14px 16px;display:grid;gap:12px;align-content:start}
  .ctl-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .ctl-row .label{font-size:13px;color:var(--sub);min-width:64px}
  .seg{display:inline-flex;background:#eef2f5;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
  .seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:13px;
    color:var(--sub);cursor:pointer;white-space:nowrap}
  .seg button.on{background:var(--card);color:var(--brand);font-weight:600;box-shadow:var(--shadow)}
  .chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);cursor:pointer;user-select:none}
  .chk input{accent-color:var(--brand)}

  /* 主卡片 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:26px 22px}
  .stem-tag{font-size:12px;color:var(--sub);letter-spacing:.05em;margin-bottom:10px}
  .stem{font-size:38px;font-weight:700;text-align:center;letter-spacing:.04em;margin:10px 0 22px;
    word-break:break-word;min-height:48px}
  .stem.pinyin{font-size:30px;letter-spacing:.06em}
  .answer-row{display:flex;gap:10px;flex-wrap:wrap}
  .answer-row input{flex:1;min-width:180px;font-size:20px;padding:12px 14px;border:1.5px solid var(--line);
    border-radius:10px;outline:none;font-family:inherit}
  .answer-row input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,168,.14)}
  .choice-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .choice-btn{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:14px 12px;
    font-size:19px;cursor:pointer;font-family:inherit;color:var(--ink);letter-spacing:.03em}
  .choice-btn:hover{border-color:var(--brand)}
  .choice-btn.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
  .choice-btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
  .choice-btn:disabled{cursor:default}
  .btn{border:0;border-radius:10px;padding:12px 18px;font-size:15px;cursor:pointer;font-family:inherit}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.ghost{background:#eef2f5;color:var(--ink)}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  .feedback{margin-top:18px;border-radius:12px;padding:14px 16px;display:none}
  .feedback.show{display:block}
  .feedback.ok{background:var(--ok-soft);color:var(--ok)}
  .feedback.bad{background:var(--bad-soft);color:var(--bad)}
  .feedback .fb-title{font-weight:700;font-size:15px;margin-bottom:6px}
  .feedback .fb-line{font-size:14px;margin-top:4px}
  .feedback .fb-line b{font-weight:600}
  .next-row{margin-top:16px;display:flex;justify-content:flex-end;gap:10px}
  .result-slot{display:flex;flex-direction:column}

  /* 进度 */
  .progress{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:12px 16px}
  .prog-top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--sub)}
  .prog-reset{border:0;background:#eef2f5;color:var(--sub);font-size:12px;border-radius:8px;
    padding:5px 10px;cursor:pointer;font-family:inherit}
  .prog-reset:hover{color:var(--ink)}
  .prog-reset:disabled{opacity:.45;cursor:default}
  .prog-track{height:6px;background:#eef2f5;border-radius:3px;overflow:hidden;margin-top:9px}
  .prog-track i{display:block;height:100%;width:0;background:var(--brand);border-radius:3px;
    transition:width .25s ease}

  /* 统计 */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .stat .num{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .stat .cap{font-size:12px;color:var(--sub);margin-top:2px}

  /* 错题本弹窗 */
  .modal-mask{position:fixed;inset:0;background:rgba(20,35,50,.42);display:none;
    align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:40}
  .modal-mask.show{display:flex}
  .modal-panel{background:var(--card);border-radius:var(--radius);box-shadow:0 12px 36px rgba(20,40,60,.22);
    width:100%;max-width:560px;max-height:76vh;display:flex;flex-direction:column;overscroll-behavior:contain}
  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:16px 18px;border-bottom:1px solid var(--line)}
  .modal-head h2{font-size:15px;display:flex;align-items:baseline;gap:8px}
  .modal-head .modal-actions{display:flex;gap:8px;align-items:center}
  .modal-head button{border:0;background:#eef2f5;border-radius:8px;padding:6px 12px;font-size:13px;
    cursor:pointer;color:var(--ink);font-family:inherit}
  .modal-head button.close{font-size:16px;padding:4px 10px}
  .wrong-list{display:flex;flex-wrap:wrap;gap:8px;padding:16px 18px;overflow:auto}
  .wrong-item{border-radius:8px;padding:6px 10px;font-size:13px;
    display:inline-flex;gap:8px;align-items:center;border:1px solid transparent}
  .wrong-item.lv0{background:var(--bad-soft);color:var(--bad)}
  .wrong-item.lv1{background:#fdeceb;color:var(--bad);border-color:#f3c0c0}
  .wrong-item.lv2{background:#fdf3dd;color:var(--warn);border-color:#f0d9a8}
  .wrong-item .py{opacity:.7}
  .wrong-item .dots{display:inline-flex;gap:3px}
  .wrong-item .dots i{width:6px;height:6px;border-radius:50%;background:rgba(120,120,120,.25)}
  .wrong-item .dots i.on{background:currentColor}
  .wrong-item button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:13px}
  .wrong-item a.dict-link{color:var(--brand);text-decoration:none;font-size:12px}
  .wrong-item a.dict-link:hover{text-decoration:underline}
  .feedback a.dict-link{color:inherit;text-decoration:underline}
  .empty{color:var(--sub);font-size:13px}
  /* 悬浮提示：JS 定位的 fixed 气泡，不参与布局，不会撑出横向滚动 */
  #tip{position:fixed;left:0;top:0;z-index:60;background:#1f2d3a;color:#fff;font-size:12px;
    line-height:1.55;padding:7px 10px;border-radius:8px;max-width:min(260px, calc(100vw - 24px));text-align:left;
    box-shadow:0 8px 22px rgba(20,40,60,.22);opacity:0;visibility:hidden;
    transition:opacity .12s ease;pointer-events:none}
  .tip-q{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;
    border-radius:50%;background:#eef2f5;color:var(--sub);font-size:11px;cursor:help;user-select:none}
  .tip-line{font-size:12px;color:var(--sub);margin-top:12px;text-align:center;line-height:1.6}
  /* 页尾 */
  footer.foot{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);
    display:flex;justify-content:center;font-size:13px;color:var(--sub)}
  footer.foot .author-info{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
  footer.foot .separator{opacity:.4}
  footer.foot a{color:var(--sub);text-decoration:none;border-bottom:1px dotted currentColor;padding-bottom:1px}
  footer.foot a:hover{color:var(--brand);border-bottom-color:var(--brand)}
  header.top .sub{font-size:12.5px;color:var(--sub);margin-top:4px;line-height:1.7}
  header.top .sub #todayMeta{margin-left:8px;white-space:nowrap}
  select{padding:7px 10px;font-size:13px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--ink);font-family:inherit;max-width:100%}
  #remoteUrl{width:230px;max-width:100%}
  #importInfo{flex:1 0 100%;font-size:12px;line-height:1.6}
  .syl{display:inline-block}
  .syl.neu{border-bottom:2px dotted var(--sub);line-height:1.25}
  .stem .syl.neu{color:var(--sub)}
  kbd{background:#eef2f5;border-radius:5px;padding:1px 6px;font-size:12px;font-family:inherit}
  /* 放在最后，确保覆盖上面的基础宽度 */
  @media (min-width:900px){ #remoteUrl{width:auto;flex:1 1 200px;min-width:0} }
  /* 老浏览器不认 scrollbar-gutter 时，固定显示滚动条，避免宽度抖动 */
  @supports not (scrollbar-gutter: stable){ html{overflow-y:scroll} }
  /* 触屏与动效偏好 */
  .seg button,.btn,.choice-btn,.prog-reset,.chk,.close{touch-action:manipulation}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>普测拼音刷题</h1>
      <div class="sub">
        <span>普通话水平测试 · 易错字词 / 难字生僻 · 键盘拼音练习</span>
        <span id="todayMeta"></span>
      </div>
    </div>
    <span class="meta" id="libMeta">题库加载中…</span>
  </header>

  <div class="layout">
  <!-- 控制条 -->
  <section class="controls">
    <div class="ctl-row">
      <span class="label">题型</span>
      <div class="seg" id="modeSeg">
        <button data-mode="py" class="on">看字写拼音</button>
        <button data-mode="hz">看拼音写汉字</button>
      </div>
    </div>
    <div class="ctl-row">
      <span class="label">方式</span>
      <div class="seg" id="inputSeg">
        <button data-input="spell" class="on">拼写输入</button>
        <button data-input="choice">选读音</button>
      </div>
    </div>
    <div class="ctl-row">
      <span class="label">范围</span>
      <div class="seg" id="scopeSeg">
        <button data-scope="all" class="on">全部</button>
        <button data-scope="single">单字</button>
        <button data-scope="multi">多字</button>
        <button data-scope="erhua">儿化</button>
        <button data-scope="qingsheng">轻声</button>
        <button data-scope="hard">难字生僻</button>
        <button data-scope="yicuo">易错</button>
      </div>
      <label class="chk tip" data-tip="只从错题本里抽题；错题连续答对三次才移出"><input type="checkbox" id="wrongOnly"> 只练错题</label>
      <label class="chk tip" data-tip="判题时不比较声调，只要音节对就算对"><input type="checkbox" id="ignoreTone"> 忽略声调判题</label>
    </div>
    <div class="ctl-row">
      <span class="label">来源</span>
      <select id="srcSel"><option value="">全部来源</option></select>
      <label class="chk tip" data-tip="答对后稍等片刻自动进入下一题；关掉则需按回车换题"><input type="checkbox" id="autoNext" checked> 答对自动下一题</label>
    </div>
    <div class="ctl-row">
      <span class="label">顺序</span>
      <div class="seg" id="orderSeg">
        <button data-order="random" class="on">随机</button>
        <button data-order="seq">顺序</button>
      </div>
      <button class="btn ghost tip" id="importBtn" style="padding:6px 12px;font-size:13px"
              data-tip="导入自己的词库 JSON：数组，字段 word / pinyin / tags / source；会校验拼音格式与音节数，同名词条覆盖内置读音">本地 JSON</button>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none">
      <input id="remoteUrl" type="text" inputmode="url" autocomplete="off" spellcheck="false"
             placeholder="词库 JSON 网址（留空用默认）"
             style="padding:6px 10px;font-size:13px;border:1px solid var(--line);border-radius:8px;background:var(--card)">
      <span class="tip-q tip" data-tip="填词库 JSON 的网址再点「从网址加载」；该网址需允许跨站读取">?</span>
      <button class="btn ghost" id="remoteBtn" style="padding:6px 12px;font-size:13px">从网址加载</button>
      <button class="btn ghost tip" id="openWrongBtn" style="padding:6px 12px;font-size:13px"
              data-tip="打开错题本；连续答对三次自动移出，也能手动移除或清空">错题本 <span id="wrongCountBtn">0</span></button>
      <span class="meta" id="importInfo"></span>
    </div>
  </section>

  <div class="main">
  <!-- 进度 -->
  <section class="progress">
    <div class="prog-top">
      <span id="progText">已刷 0 / 0 条</span>
      <button class="prog-reset tip" id="progResetBtn"
              data-tip="清空所有已刷记录，已刷过的词会重新进入题目池（不影响错题本）">重置进度</button>
    </div>
    <div class="prog-track"><i id="progFill"></i></div>
  </section>

  <!-- 统计 -->
  <section class="stats">
    <div class="stat"><div class="num" id="stTotal">0</div><div class="cap">本轮已答</div></div>
    <div class="stat"><div class="num" id="stOk" style="color:var(--ok)">0</div><div class="cap">答对</div></div>
    <div class="stat"><div class="num" id="stBad" style="color:var(--bad)">0</div><div class="cap">答错</div></div>
    <div class="stat"><div class="num" id="stRate">–</div><div class="cap">正确率</div></div>
  </section>

  <!-- 主卡片 -->
  <section class="card">
    <div class="stem-tag" id="stemTag">题目</div>
    <div class="stem" id="stem">加载中…</div>
    <div class="answer-row">
      <input id="answer" type="text" enterkeyhint="go" autocomplete="off" autocapitalize="off" spellcheck="false"
             title="可用数字标调：音节后加 1 阴平 2 阳平 3 上声 4 去声，轻声不标（0 或 5 也行），如 zhu4 yin1、gan1 jing0；也可直接打带调字母，v 等于 ü"
             placeholder="如 huo3 che1，回车提交">
      <button class="btn primary" id="submitBtn">提交</button>
    </div>
    <div class="choice-row" id="choiceRow" style="display:none"></div>
    <div class="result-slot">
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="next-row" id="nextRow" style="display:none">
        <button class="btn ghost" id="wrongToggleBtn">移出错题本</button>
        <button class="btn primary" id="nextBtn">下一题 ↵</button>
      </div>
    </div>
  </section>
  </div><!-- /.main -->
  </div><!-- /.layout -->

  <!-- 错题本弹窗 -->
  <div class="modal-mask" id="wrongModal">
    <div class="modal-panel" role="dialog" aria-modal="true" aria-label="错题本">
      <div class="modal-head">
        <h2>错题本 <span class="meta" id="wrongCount"></span></h2>
        <div class="modal-actions">
          <button id="clearWrongBtn">清空错题</button>
          <button class="close" id="closeWrongBtn" title="关闭" aria-label="关闭">×</button>
        </div>
      </div>
      <div class="wrong-list" id="wrongList"></div>
    </div>
  </div>

  <p class="tip-line">
    回车 提交 / 下一题 · 选读音模式可按 <kbd>1</kbd>–<kbd>4</kbd> 选择 · 轻声音节带点状下划线
  </p>

  <footer class="foot">
    <div class="author-info">
      <span class="author-name">作者: Stream-L</span>
      <span class="separator">|</span>
      <a href="https://stream-l.github.io/" target="_blank" rel="noopener">博客</a>
      <span class="separator">|</span>
      <span class="credit">整理：DeepSeek Harness</span>
    </div>
  </footer>
<div id="tip" role="tooltip"></div>
</div>

// ---------- 错题本：Cookie 持久化（file:// 下 Cookie 被浏览器禁用，自动回退 localStorage） ----------
const WRONG_COOKIE="pth_wrong";
function parseWrong(raw){
  let o; try{ o=JSON.parse(raw); }catch(e){ return {}; }
  if(Array.isArray(o)){ const r={}; o.forEach(w=>r[w]=0); return r; } // 兼容旧版数组格式
  return (o&&typeof o==="object")?o:{};
}
function readWrongStore(){
  const m=document.cookie.match(/(?:^|;\s*)pth_wrong=([^;]*)/);
  if(m) return parseWrong(decodeURIComponent(m[1]));
  try{ return parseWrong(localStorage.getItem("pth_wrong")||"{}"); }catch(e){ return {}; }
}
function writeWrongStore(obj){
  const val=encodeURIComponent(JSON.stringify(obj));
  document.cookie=`${WRONG_COOKIE}=${val};path=/;max-age=31536000;SameSite=Lax`;
  try{ localStorage.setItem("pth_wrong",JSON.stringify(obj)); }catch(e){}
}

// 2500 条词用 cookie 存会超 4KB 上限（会被浏览器悄悄截断），而且 file:// 下 cookie 本身就被禁用，
// 所以这里只用 localStorage；存的是「答对过一次」的词，答错的词不进已完成，还会再出。
const DONE_KEY="pth_done_v1";
function readDoneStore(){
  try{
    const arr=JSON.parse(localStorage.getItem(DONE_KEY)||"[]");
    return Array.isArray(arr)?arr.filter(w=>typeof w==="string"):[];
  }catch(e){ return []; }
}
function saveDone(){
  try{ localStorage.setItem(DONE_KEY, JSON.stringify([...state.done])); }catch(e){}
}

// 外部导入词条：同名（word）会覆盖内置 RAW 的读音，未重名的追加到 EXTRA
const EXTRA=[];
const overridden=new Set();
// 默认远程词库 JSON 地址：填好后打开页面会自动联网加载；留空则不自动拉取。
// 远程文件需允许跨域（返回 Access-Control-Allow-Origin: *），否则浏览器会拦截。
const DEFAULT_REMOTE_URL = "https://raw.githubusercontent.com/Stream-L/files-for-share/refs/heads/main/data/%E6%99%AE%E6%B5%8B%E5%A4%96%E9%83%A8%E6%98%93%E9%94%99%E8%AF%8D%E5%8C%85.json";
const REMOTE_STORE_KEY = "pth_remote_url";
function allWords(){
  const base = overridden.size ? RAW.filter(x=>!overridden.has(x.word)) : RAW;
  return base.concat(EXTRA);
}

const state = {
  mode: "py",          // py=看字写拼音, hz=看拼音写汉字
  inputMode: "spell",  // spell=拼写输入, choice=选读音
  scope: "all",
  src: "",             // 来源筛选，空=全部
  order: "random",
  ignoreTone: false,
  wrongOnly: false,
  autoNext: true,
  pool: [],            // 当前题目队列
  idx: 0,
  cur: null,
  answered: false,
  round: { total: 0, ok: 0, bad: 0 },
  wrong: new Map(Object.entries(readWrongStore())),
  done: new Set(readDoneStore())   // 已刷（答对过）的词
};
let autoTimer = null;

// ---------- 工具：拼音归一化 / 数字调号 ----------
const TONE_MAP = {
  "ā":"a","á":"a","ǎ":"a","à":"a",
  "ē":"e","é":"e","ě":"e","è":"e",
  "ī":"i","í":"i","ǐ":"i","ì":"i",
  "ō":"o","ó":"o","ǒ":"o","ò":"o",
  "ū":"u","ú":"u","ǔ":"u","ù":"u",
  "ǖ":"ü","ǘ":"ü","ǚ":"ü","ǜ":"ü","ü":"ü"
};
const TONE_RE = /[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/;
const TONE_CHARS = {
  a:["ā","á","ǎ","à"], o:["ō","ó","ǒ","ò"], e:["ē","é","ě","è"],
  i:["ī","í","ǐ","ì"], u:["ū","ú","ǔ","ù"], ü:["ǖ","ǘ","ǚ","ǜ"]
};
const INITIALS = ["zh","ch","sh","b","p","m","f","d","t","n","l","g","k","h","j","q","x","r","z","c","s","y","w"];
const FINALS = ["iang","uang","iong","ian","uan","üan","iao","uai","iou","uei","uen","ua","uo","ia","ie","üe","ue","ang","eng","ong","ing","ai","ei","ao","ou","iu","ui","un","an","en","in","er","a","o","e","i","u","ü"];

function stripTone(s){
  return s.split("").map(c=>TONE_MAP[c]||c).join("");
}
function pickVowel(letters){
  const has=c=>letters.includes(c);
  if(has("a")) return "a";
  if(has("o")) return "o";
  if(has("e")) return "e";
  if(has("i")&&has("u")) return letters.lastIndexOf("u")>letters.lastIndexOf("i")?"u":"i";
  if(has("i")) return "i";
  if(has("u")) return "u";
  if(has("ü")) return "ü";
  return null;
}
// 单个音节：字母 + 末尾声调数字（1阴平 2阳平 3上声 4去声，0/5/省略=轻声）
function convertToken(t){
  const m=t.match(/^([a-zü]+?)([0-5])$/);
  if(!m) return t;
  let letters=m[1]; const d=+m[2];
  if(d===0 || d===5) return letters;
  const v=pickVowel(letters);
  if(!v) return letters;
  const idx=letters.indexOf(v);
  return letters.slice(0,idx)+TONE_CHARS[v][d-1]+letters.slice(idx+1);
}
function normalizeInput(s){
  let r=(s||"").toLowerCase().trim().replace(/v/g,"ü").replace(/[·'’]/g,"");
  // j/q/x/y 后的 ü 写作 u（jué 等于 jüé），必须在转调号符号之前做
  r=r.replace(/([jqxy])ü/g,"$1u");
  return r.split(/\s+/).map(convertToken).join("");
}
// 判题归一化：可选忽略声调
function norm(s, ignoreTone){
  let r=normalizeInput(s).replace(/\s+/g,"");
  if(ignoreTone) r=stripTone(r);
  return r;
}
function isCorrect(input, answer, ignoreTone){
  return norm(input, ignoreTone) === norm(answer, ignoreTone);
}
// 把连写拼音切成带调音节数组；· 与 ' 都视为音节边界
function splitPy(py){
  const out=[];
  // 空格、·、撇号都是音节硬边界：词语表里「一蹴而就」写作 yí cù ér jiù，
  // 若不按空格切，「cùér」会被当成 cù + ué + r
  for(const raw of (py||"").split(/[\s·'’]+/)){
    const part=raw;
    if(!part) continue;
    const plain=stripTone(part);
    let i=0; const seg=[];
    while(i<plain.length){
      let ini="";
      for(const s of INITIALS){ if(plain.startsWith(s,i)){ini=s;break;} }
      let k=i+ini.length, fin="";
      for(const f of FINALS){
        // 「ue」只用于 j/q/x/y 之后的 üe（jué/xué），零声母「é」不能被它吃掉
        if(f==="ue" && !/[jqxy]$/.test(ini)) continue;
        if(plain.startsWith(f,k)){fin=f;break;}
      }
      let k2 = fin ? k+fin.length : i+1;
      seg.push(part.slice(i,k2));
      i=k2;
    }
    // 儿化尾 r 并入上一音节
    if(seg.length>1 && seg[seg.length-1]==="r"){
      seg[seg.length-2]+="r"; seg.pop();
    }
    out.push(...seg);
  }
  return out;
}
// 展示用：把连写拼音按音节加空格
function formatPy(py){ return splitPy(py).join(" "); }

// 切成 [{txt, neutral}]：neutral = 被 · 隔开且该音节没标调（真轻声）
function splitPyMarked(py){
  const out=[];
  (py||"").split("·").forEach((seg,gi)=>{
    splitPy(seg).forEach((s,si)=>{
      out.push({ txt:s, neutral: gi>0 && si===0 && !TONE_RE.test(s) });
    });
  });
  return out;
}
function hasNeutral(py){ return splitPyMarked(py).some(x=>x.neutral); }
// 轻声的音节点状下划线标出来
function fmtPyHtml(py){
  return splitPyMarked(py)
    .map(x=>`<span class="syl${x.neutral?" neu":""}">${escapeHtml(x.txt)}</span>`)
    .join(" ");
}
// 儿化：末音节以 r 收尾（不是 er 本身），如 bàr / xiàohuar
function isErhuaEntry(x){
  const syls=splitPy((x&&x.pinyin)||"");
  const last=stripTone(syls[syls.length-1]||"");
  return last.length>1 && last.endsWith("r") && last!=="er";
}
// 词条来源列表（内置没有 source 字段）
function sourceList(x){
  const s=(x&&x.source)||"";
  const arr=s.split(/[；;]/).map(v=>v.trim()).filter(Boolean);
  return arr.length?arr:["内置基础库"];
}
function matchesSource(x,sel){ return !sel || sourceList(x).includes(sel); }

// ---------- 音近干扰项生成（普测易混对 + 组合网格，避免特征交集泄题） ----------
// 易混声母：送气/不送气、n/l、平翘舌、f/h、j/q/x 等
const CONF_INI = {
  b:["p"], p:["b"], d:["t"], t:["d"], g:["k"], k:["g"],
  n:["l"], l:["n"], f:["h"], h:["f"],
  zh:["z","sh"], z:["zh"], ch:["c","sh"], c:["ch"], sh:["s"], s:["sh"],
  j:["q","x"], q:["j","x"], x:["j","q"], r:["l"]
};
// 易混韵母：前后鼻音
const CONF_FIN = {
  en:["eng"], eng:["en"], in:["ing"], ing:["in"],
  an:["ang"], ang:["an"], ian:["iang"], iang:["ian"], uan:["uang"], uang:["uan"]
};
function parseSyl(syl){
  const plain=stripTone(syl);
  let ini="";
  for(const s of INITIALS){ if(plain.startsWith(s)){ini=s;break;} }
  const rest=plain.slice(ini.length);
  let fin="";
  for(const f of FINALS){ if(rest.startsWith(f)){fin=f;break;} }
  let tone=0, vowel=null;
  for(const ch of syl){
    if(TONE_MAP[ch]!==undefined){
      vowel=TONE_MAP[ch]; tone=TONE_CHARS[vowel].indexOf(ch)+1; break;
    }
  }
  return {ini,fin,tone,vowel};
}
function buildSyl(p){
  let letters=p.ini+p.fin;
  if(p.tone>0 && p.vowel){
    const arr=TONE_CHARS[p.vowel];
    const idx=letters.indexOf(p.vowel);
    if(idx>=0) letters=letters.slice(0,idx)+arr[p.tone-1]+letters.slice(idx+1);
  }
  return letters;
}
function altInitial(ini){
  const conf=CONF_INI[ini];
  if(conf && Math.random()<0.7) return conf[Math.floor(Math.random()*conf.length)];
  const others=INITIALS.filter(s=>s!==ini);
  return others[Math.floor(Math.random()*others.length)];
}
function altFinal(fin){
  const conf=CONF_FIN[fin];
  if(conf) return conf[0];
  return fin; // 无前后鼻音对应对时保留原韵母，不硬拼不搭的韵母
}
function altTone(tone){
  const ts=[1,2,3,4].filter(t=>t!==tone);
  return ts[Math.floor(Math.random()*ts.length)];
}
// 基于正确读音生成 3 个干扰项：特征（声母/韵母/声调）成对出现，正确答案不是唯一交集
function variantsFor(py){
  const parts=splitPy(py).map(parseSyl);
  const i=Math.floor(Math.random()*parts.length);
  const base=parts[i];
  const compose=(ini,fin,tone)=>{
    const np=Object.assign({},base,{ini,fin,tone});
    if(tone>0 && !np.vowel) np.vowel=pickVowel(fin.split(""));
    return parts.map((q,qi)=>qi===i?buildSyl(np):buildSyl(q)).join(" ");
  };
  const ini2=altInitial(base.ini), fin2=altFinal(base.fin), tone2=altTone(base.tone);
  const out=[];
  const strategy=Math.random();
  const push=v=>{ if(!out.includes(v)) out.push(v); };
  if(strategy<0.45){
    // 2×2 网格（声母 × 声调）：声母、声调各出现两次，三格覆盖其余组合
    push(compose(ini2,base.fin,base.tone));
    push(compose(base.ini,base.fin,tone2));
    push(compose(ini2,base.fin,tone2));
  }else if(strategy<0.75){
    // 平行换声母：韵母、声调固定，只动声母，三个声母互不相同
    const iniSet=new Set();
    let guard=0;
    while(iniSet.size<3 && guard<15){
      guard++;
      const a=altInitial(base.ini);
      if(a!==base.ini) iniSet.add(a);
    }
    for(const a of iniSet) push(compose(a,base.fin,base.tone));
  }else if(fin2!==base.fin){
    // 韵母升格（前后鼻音）：声母、韵母交替替换，韵母各出现两次
    push(compose(ini2,base.fin,base.tone));
    push(compose(base.ini,fin2,base.tone));
    push(compose(ini2,fin2,base.tone));
  }else{
    // 无易混韵母可换时，退回声母 × 声调网格
    push(compose(ini2,base.fin,base.tone));
    push(compose(base.ini,base.fin,tone2));
    push(compose(ini2,base.fin,tone2));
  }
  return out;
}
// 校验单个音节看着像合法拼音（有声母可选 + 至少一个元音）
function isValidPySyl(s){
  const plain=stripTone(s);
  return /^[bpmfdtnlgkhjqxrzcsyw]?[a-zü]+$/.test(plain) && /[aeiouü]/.test(plain);
}
function isValidVariant(v, refPy){
  if(norm(v)===norm(refPy)) return false;
  const a=splitPy(v), b=splitPy(refPy);
  return a.length===b.length && a.every(isValidPySyl);
}

// ---------- 取题 ----------
function matchScope(x, scope){
  if(scope==="single") return x.word.length===1;
  if(scope==="multi") return x.word.length>1;
  if(scope==="erhua") return isErhuaEntry(x);
  if(scope==="qingsheng") return hasNeutral(x.pinyin);
  if(scope==="hard") return (x.tags||[]).includes("难字");
  if(scope==="yicuo") return (x.tags||[]).includes("易错");
  return true;
}
// 当前范围+来源下的全部词条（不含「已刷」过滤），进度条与出题共用
function scopeList(scope, src){
  const s = scope===undefined ? state.scope : scope;
  const k = src===undefined ? state.src : src;
  return allWords().filter(x=>matchScope(x,s) && matchesSource(x,k));
}

function buildPool(){
  // 只练错题时按错题本出题，否则跳过已经答对过的词，避免重复刷
  let list = scopeList();
  if(state.wrongOnly) list = list.filter(x=>state.wrong.has(x.word));
  else list = list.filter(x=>!state.done.has(x.word));
  if(state.order==="random"){
    for(let i=list.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [list[i],list[j]]=[list[j],list[i]];
    }
  }
  state.pool = list;
  state.idx = 0;
  renderProgress();
}

function renderProgress(){
  const all = scopeList();
  const total = all.length;
  const done = all.reduce((n,x)=>n+(state.done.has(x.word)?1:0),0);
  const raw = total ? done*100/total : 0;                  // 真实百分比，用于进度条
  const shown = raw>=10 ? Math.round(raw) : Math.round(raw*100)/100;  // 小于 10% 保留两位，避免长期显示 0%
  const txt=document.getElementById("progText");
  if(txt) txt.textContent = total ? `当前范围已刷 ${done} / ${total} 条 · ${shown}%` : "当前范围没有词条";
  const fill=document.getElementById("progFill");
  if(fill) fill.style.width = raw+"%";
  const btn=document.getElementById("progResetBtn");
  if(btn) btn.disabled = done===0;
}

function showEnd(){
  document.getElementById("stem").textContent = state.wrongOnly ? "错题已练完" : "这个范围已经全部刷完";
  document.getElementById("answer").style.display="none";
  document.getElementById("submitBtn").style.display="none";
  document.getElementById("choiceRow").style.display="none";
  document.getElementById("nextRow").style.display="none";
  state.cur=null;
  renderStemTagEnd();
}
function renderStemTagEnd(){
  const tag=document.getElementById("stemTag");
  if(!tag) return;
  if(state.wrongOnly){ tag.textContent="错题本已清空"; return; }
  const total=scopeList().length;
  tag.textContent = total
    ? `已刷完 ${total} 条 · 点上方「重置进度」可从头再练`
    : "当前范围没有题目 · 换个范围或来源试试";
}

function nextQuestion(){
  if(autoTimer){ clearTimeout(autoTimer); autoTimer=null; }
  if(state.idx >= state.pool.length){
    // 只练错题：未掌握的错题继续循环，直到全部移出
    if(state.wrongOnly && state.wrong.size>0) buildPool();
    if(state.idx >= state.pool.length){
      showEnd();
      return;
    }
  }
  state.cur = state.pool[state.idx++];
  state.answered = false;
  const fb=document.getElementById("feedback");
  fb.className="feedback"; fb.innerHTML="";
  document.getElementById("nextRow").style.display="none";
  const ans=document.getElementById("answer");
  ans.value=""; ans.disabled=false;
  renderStem();
  applyInputMode();
}

// ---------- 答题方式：拼写 / 选读音 ----------
function applyInputMode(){
  const spell=state.inputMode==="spell";
  const ans=document.getElementById("answer");
  document.getElementById("submitBtn").style.display=spell?"":"none";
  document.getElementById("choiceRow").style.display=spell?"none":"grid";
  if(spell){ ans.style.display=""; ans.focus(); }
  else{ ans.style.display="none"; buildChoices(); }
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function buildChoices(){
  const row=document.getElementById("choiceRow");
  const c=state.cur;
  let opts=[];
  if(state.mode==="py"){
    const correctDisp=formatPy(c.pinyin);
    const n=splitPy(c.pinyin).length;
    // 音近变体（网格/平行/升格，特征成对出现）；不足再用同音节随机词兜底
    const variants=variantsFor(c.pinyin).filter(v=>isValidVariant(v,c.pinyin));
    const pool=shuffle(allWords().filter(x=>norm(x.pinyin)!==norm(c.pinyin) && splitPy(x.pinyin).length===n));
    opts=[correctDisp];
    for(const v of variants){ if(opts.length<4 && !opts.includes(v)) opts.push(v); }
    for(const x of pool){ if(opts.length>=4) break; const v=formatPy(x.pinyin); if(!opts.includes(v)) opts.push(v); }
    if(opts.length<4){ // 兜底：同音节池不足时放宽
      const rest=shuffle(allWords().filter(x=>norm(x.pinyin)!==norm(c.pinyin)));
      for(const x of rest){ if(opts.length>=4) break; const v=formatPy(x.pinyin); if(!opts.includes(v)) opts.push(v); }
    }
  }else{
    const n=c.word.length;
    const pool=shuffle(allWords().filter(x=>x.word!==c.word && x.word.length===n));
    opts=[c.word];
    for(const x of pool){ if(opts.length>=4) break; if(!opts.includes(x.word)) opts.push(x.word); }
  }
  shuffle(opts);
  row.innerHTML=opts.map(o=>`<button class="choice-btn" data-t="${escapeHtml(o)}">${escapeHtml(o)}</button>`).join("");
  row.querySelectorAll(".choice-btn").forEach(b=>{ b.onclick=()=>selectChoice(b); });
}

function selectChoice(btn){
  if(!state.cur || state.answered) return;
  const opt=btn.dataset.t;
  const correct=state.mode==="py"?state.cur.pinyin:state.cur.word;
  const ok=state.mode==="py"?isCorrect(opt,correct,state.ignoreTone):opt===correct;
  const btns=[...document.querySelectorAll(".choice-btn")];
  btns.forEach(b=>{
    b.disabled=true;
    const t=b.dataset.t;
    const match=state.mode==="py"?isCorrect(t,correct,state.ignoreTone):t===correct;
    if(match) b.classList.add("ok");
  });
  if(!ok) btn.classList.add("bad");
  finish(ok, opt);
}

// 判题后统一反馈 / 统计 / 错题入库（拼写与选择共用）
function finish(ok, userInput){
  const c=state.cur;
  const answer=state.mode==="py"?c.pinyin:c.word;
  const dispAns=state.mode==="py"?fmtPyHtml(answer):escapeHtml(answer);
  const dispStem=state.mode==="py"?escapeHtml(c.word):fmtPyHtml(c.pinyin);
  state.answered=true;
  state.round.total++;
  const fb=document.getElementById("feedback");
  if(ok){
    state.round.ok++;
    // 已刷记录：答对一次即记为已完成，之后不再出现（答错的不记，还会再练）
    if(!state.done.has(c.word)){ state.done.add(c.word); saveDone(); }
    // 掌握度递进：错题答对一次升一级，连续答对三次才移出错题本（红 → 橙红 → 黄 → 消失）
    let kept=false, keptLv=0;
    if(state.wrong.has(c.word)){
      const lv=(state.wrong.get(c.word)||0)+1;
      if(lv>=3) state.wrong.delete(c.word);
      else{ state.wrong.set(c.word,lv); kept=true; keptLv=lv; }
    }
    fb.className="feedback show ok";
    const keptMsg=kept?`<div class="fb-line" style="opacity:.75">已巩固 ${keptLv}/3，再答对 ${3-keptLv} 次移出错题本</div>`:'';
    fb.innerHTML=`<div class="fb-title">回答正确</div>
      <div class="fb-line">${dispStem} — <b>${dispAns}</b></div>
      ${keptMsg}`;
  }else{
    state.round.bad++;
    state.wrong.set(c.word,0);
    fb.className="feedback show bad";
    const hint=state.mode==="py"?neutralHint(userInput, answer):"";
    fb.innerHTML=`<div class="fb-title">回答错误</div>
      <div class="fb-line">你的答案：<b>${escapeHtml(userInput)}</b></div>
      <div class="fb-line">正确答案：<b>${dispAns}</b></div>
      ${hint?`<div class="fb-line" style="opacity:.8">${hint}</div>`:""}`;
  }
  fb.insertAdjacentHTML("beforeend",
    `<div class="fb-line"><a class="dict-link" target="_blank" rel="noopener" href="${dictUrl(c.word)}">查词典：${escapeHtml(c.word)}（读音 · 释义）</a></div>`);
  saveWrong();
  document.getElementById("nextRow").style.display="flex";
  document.getElementById("nextBtn").focus();
  renderStats(); renderWrong(); renderProgress();
  if(ok && state.autoNext){
    autoTimer=setTimeout(()=>{ autoTimer=null; nextQuestion(); },700);
  }
}

// 答错但只是因为轻声音节标了声调时，给一句针对性提示
function neutralHint(userInput, answer){
  const a=splitPyMarked(answer);
  const u=splitPy(normalizeInput(userInput||""));
  if(!a.length || a.length!==u.length) return "";
  for(let i=0;i<a.length;i++){
    if(a[i].neutral && stripTone(u[i])===stripTone(a[i].txt))
      return `提示：第 ${i+1} 个音节读轻声，不标调，写成 ${escapeHtml(a[i].txt)}`;
  }
  return "";
}

function renderStem(){
  const c=state.cur;
  const tag=document.getElementById("stemTag");
  const stem=document.getElementById("stem");
  const bits=[ state.mode==="py"?"看字写拼音":"看拼音写汉字" ];
  bits.push(`第 ${state.idx}/${state.pool.length} 题`);
  if((c.tags||[]).length) bits.push(c.tags.join("／"));
  if(c.source) bits.push(c.source.split(/[；;]/)[0]);
  tag.textContent = bits.join(" · ");
  const ans=document.getElementById("answer");
  if(ans) ans.placeholder = state.mode==="py" ? "输入拼音，如 gan1 jing；轻声不标调" : "输入汉字，回车提交";
  if(state.mode==="py"){
    stem.textContent = c.word;
    stem.classList.remove("pinyin");
  }else{
    stem.innerHTML = fmtPyHtml(c.pinyin);
    stem.classList.add("pinyin");
  }
}

// ---------- 判题 ----------
function submit(){
  if(!state.cur || state.answered) return;
  const ans=document.getElementById("answer");
  const input=ans.value;
  if(!input.trim()) return;
  const answer = state.mode==="py" ? state.cur.pinyin : state.cur.word;
  const ok = isCorrect(input, answer, state.ignoreTone);
  ans.disabled = true;
  finish(ok, input);
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function renderWrong(){
  const list=document.getElementById("wrongList");

  const btn=document.getElementById("wrongCountBtn");

  if(!arr.length){ list.innerHTML='<span class="empty">暂无错题</span>'; return; }
  list.innerHTML=arr.map(([w,lv])=>{
    const item=allWords().find(x=>x.word===w);
    const py=item?formatPy(item.pinyin):"";
    const cls="wrong-item lv"+(lv>=2?2:lv===1?1:0);
    const dots=`<span class="dots"><i class="${lv>=1?"on":""}"></i><i class="${lv>=2?"on":""}"></i><i class="${lv>=3?"on":""}"></i></span>`;
    return `<span class="${cls}"><span>${escapeHtml(w)}</span><span class="py">${escapeHtml(py)}</span>${dots}
      <a class="dict-link" target="_blank" rel="noopener" href="${dictUrl(w)}">查词</a>
      <button data-w="${escapeHtml(w)}" title="移除">×</button></span>`;
  }).join("");
  list.querySelectorAll("button").forEach(b=>{
    b.onclick=()=>{ state.wrong.delete(b.dataset.w); saveWrong(); renderWrong(); };
  });
}

// ---------- 导入外部词库 JSON ----------
// 校验并规范化一条词条，返回 {ok, entry, reason}
function checkEntry(it){
  if(!it || typeof it.word!=="string" || typeof it.pinyin!=="string") return {ok:false, reason:"字段缺失"};
  const word=it.word.trim(), pinyin=it.pinyin.trim();
  if(!word || !pinyin) return {ok:false, reason:"字段为空"};
  if(/[0-9]/.test(pinyin)) return {ok:false, reason:"拼音含数字调号"};
  const syls=splitPy(pinyin);
  const plain=pinyin.replace(/[\s·'’]/g,"");
  if(!syls.length || syls.join("")!==plain) return {ok:false, reason:"拼音无法切分"};
  if(!syls.every(isValidPySyl)) return {ok:false, reason:"存在非法音节"};
  const erhua=isErhuaEntry({word,pinyin});
  const expect=erhua?word.length-1:word.length;
  if(syls.length!==expect) return {ok:false, reason:`音节数 ${syls.length} ≠ 字数 ${expect}`};
  const tags=Array.isArray(it.tags)?it.tags.map(t=>String(t).trim()).filter(Boolean):[];
  const source=typeof it.source==="string"?it.source.trim():"";
  return {ok:true, entry:{word, pinyin, tags, source}};
}

function importWords(arr){
  if(!Array.isArray(arr)){ throw new Error("JSON 顶层应为词条数组"); }
  let added=0, replaced=0;
  const bad=[];
  for(const it of arr){
    const res=checkEntry(it);
    if(!res.ok){ if(bad.length<20) bad.push(`${(it&&it.word)||"?"}（${(it&&it.pinyin)||"?"}）：${res.reason}`); continue; }
    const e=res.entry;
    const idx=EXTRA.findIndex(x=>x.word===e.word);
    if(idx>=0){ EXTRA[idx]=e; replaced++; continue; }
    if(RAW.some(x=>x.word===e.word)){ overridden.add(e.word); EXTRA.push(e); replaced++; continue; }
    EXTRA.push(e); added++;
  }
  const info=document.getElementById("importInfo");
  info.textContent=`新增 ${added} 条，覆盖 ${replaced} 条${bad.length?`，跳过无效 ${bad.length} 条（见控制台）`:""}`;
  if(bad.length) console.warn("[词库] 以下词条未导入：", bad);
  buildPool(); nextQuestion(); renderStats(); refreshLibMeta(); refreshSrcOptions();
  return {added, replaced, bad};
}

// 题库规模提示
function refreshLibMeta(){
  const el=document.getElementById("libMeta");
  if(!el) return;
  const total=allWords().length;
  const builtin=RAW.length-overridden.size;
  el.textContent=`内置 ${builtin} · 外部 ${EXTRA.length} · 合计 ${total} 条`;
}
// 「来源」下拉：从当前词库实际来源生成
function refreshSrcOptions(){
  const sel=document.getElementById("srcSel");
  if(!sel) return;
  const cur=sel.value;
  const set=new Set(["内置基础库"]);
  allWords().forEach(x=>{ if(x.source) sourceList(x).forEach(s=>set.add(s)); });
  const opts=[...set].sort((a,b)=>a.localeCompare(b,"zh"));
  sel.innerHTML='<option value="">全部来源</option>'+
    opts.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("");
  if(cur && opts.includes(cur)) sel.value=cur;
}
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=(e)=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const data=JSON.parse(rd.result);
      const arr=Array.isArray(data)?data:(data.words||data.list||data.data||[]);
      importWords(arr);
    }catch(err){ setInfo("本地导入失败："+err.message); }
    e.target.value="";
  };
  rd.readAsText(f,"utf-8");
};

// ---------- 联网加载远程词库 JSON ----------
function setInfo(msg){ document.getElementById("importInfo").textContent=msg; }

function extractArr(data){
  if(Array.isArray(data)) return data;
  return data.words||data.list||data.data||(Array.isArray(data.items)?data.items:[]);
}

async function loadRemote(url, save){
  url=(url||"").trim();
  if(!url){ setInfo("请填写词库 JSON 网址"); return; }
  setInfo("正在联网加载词库…");
  try{
    const resp=await fetch(url, {cache:"no-cache"});
    if(!resp.ok) throw new Error("HTTP "+resp.status);
    const data=await resp.json();
    const arr=extractArr(data);
    const res=importWords(arr);
    if(save!==false){
      try{ localStorage.setItem(REMOTE_STORE_KEY, url); }catch(_){}
    }
    setInfo(`已加载联网词库：新增 ${res.added} 条${res.replaced?`，覆盖内置 ${res.replaced} 条`:""}${res.bad.length?`，${res.bad.length} 条格式不对已跳过`:""}`);
  }catch(err){
    setInfo("联网加载失败：检查网址是否可访问，或该网址不允许跨站读取。");
  }
}

// ---------- 悬浮提示 ----------
const tipEl = document.getElementById("tip");
if(tipEl && document.body && document.body.appendChild) document.body.appendChild(tipEl);
function placeTip(el){
  const txt = el && el.dataset ? el.dataset.tip : "";
  if(!tipEl || !txt) return;
  tipEl.textContent = txt;
  tipEl.style.visibility = "visible";
  tipEl.style.opacity = "1";
  const r = el.getBoundingClientRect();
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  const left = Math.min(Math.max(8, r.left), Math.max(8, innerWidth - w - 8));
  let top = r.bottom + 7;
  if(top + h > innerHeight - 8) top = Math.max(8, r.top - h - 7);
  tipEl.style.left = left + "px";
  tipEl.style.top = top + "px";
}
function hideTip(){ if(tipEl){ tipEl.style.opacity = "0"; tipEl.style.visibility = "hidden"; } }
function tipTarget(e){
  const t = e && e.target;
  return t && t.closest ? t.closest("[data-tip]") : null;
}
document.addEventListener("mouseover", e => { const el = tipTarget(e); if(el) placeTip(el); });
document.addEventListener("mouseout", e => { const el = tipTarget(e); if(el) hideTip(); });
document.addEventListener("focusin", e => { const el = tipTarget(e); if(el) placeTip(el); });
document.addEventListener("focusout", hideTip);
window.addEventListener("scroll", hideTip, { passive: true });
window.addEventListener("resize", hideTip);
